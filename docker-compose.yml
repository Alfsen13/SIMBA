# SIMBA Laravel LMS - Docker Compose
# Services: app (FrankenPHP), queue workers, database, redis, vite (dev)

services:
  # =========================================================================
  # Database (MySQL 8.0 - production compatible)
  # =========================================================================
  database:
    image: mysql:8.0
    container_name: simba-db
    environment:
      MYSQL_DATABASE: simba
      MYSQL_USER: simba
      MYSQL_PASSWORD: "${DB_PASSWORD:-simba_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - simba-network

  # =========================================================================
  # Redis (untuk cache, session, queue)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: simba-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - simba-network

  # =========================================================================
  # Application (FrankenPHP) - Production
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        INSTALL_DEV: "false"
    # Satu image dipakai bersama app + semua worker, supaya kode tidak pernah
    # berbeda antar container (penyebab 500 "class not found"/versi lama).
    image: simba-app:latest
    container_name: simba-app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      APP_KEY: "${APP_KEY}"
      SANCTUM_STATEFUL_DOMAINS: "localhost:8000,127.0.0.1:8000,localhost,127.0.0.1,::1"
      # Database
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: simba
      DB_USERNAME: simba
      DB_PASSWORD: "${DB_PASSWORD:-simba_secret}"
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      # Queue
      QUEUE_CONNECTION: redis
      # Session
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      SESSION_CONNECTION: cache
      SESSION_STORE: session
      SESSION_DOMAIN: "localhost"
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: "lax"
      SESSION_HTTP_ONLY: "true"
      # Cache
      CACHE_STORE: redis
      # Mail (configure as needed)
      MAIL_MAILER: log
      # AI / ML Services
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_MODEL_FALLBACK_1: "${OLLAMA_MODEL_FALLBACK_1:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      OLLAMA_MODEL_FALLBACK_2: "${OLLAMA_MODEL_FALLBACK_2:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_ENDPOINT: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
      GEMINI_SHORT_TIMEOUT: "8"
      PYTHON_PATH: "python3.14"
      PDF_EXTRACT_TIMEOUT: "600"
      # Symbols / RAG
      SYMBOLS_ENABLED: "true"
      SYMBOLS_TOP_K: "6"
      SYMBOLS_MIN_SCORE: "1.0"
      # Remedial
      REMEDIAL_COOLDOWN_HARI: "7"
      REMEDIAL_AMBANG_PERTEMUAN: "75"
      REMEDIAL_BOBOT_TUGAS: "0.8"
      REMEDIAL_BOBOT_KUIS: "0.2"
      # Prediksi
      PREDIKSI_AMBANG_AMAN: "20"
      PREDIKSI_AMBANG_PANTAU: "40"
      # Bloom
      BLOOM_ENABLED: "true"
      BLOOM_MIN_CONFIDENCE: "0.34"
      # Konteks generate soal
      SOAL_KONTEKS_ENABLED: "true"
      SOAL_KONTEKS_MAX_CHARS: "24000"
      # RAG
      RAG_CHUNK_SIZE: "1000"
      RAG_CHUNK_OVERLAP: "200"
      RAG_TOP_K: "3"
      RAG_MIN_SCORE: "0.4"
      # Web Search
      WEB_SEARCH_ENABLED: "false"
      # Filesystem
      FILESYSTEM_DISK: public
      # FrankenPHP Worker configuration (for php_server directive)
      FRANKENPHP_WORKER: "/app/public/index.php"
      FRANKENPHP_NUM_WORKERS: "2"
      FRANKENPHP_MAX_WORKERS: "4"
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - simba-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # =========================================================================
  # Queue Workers (3 queues: ai-soal, pertemuan, default)
  # =========================================================================
  queue-ai-soal:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        INSTALL_DEV: "false"
    # Satu image dipakai bersama app + semua worker, supaya kode tidak pernah
    # berbeda antar container (penyebab 500 "class not found"/versi lama).
    image: simba-app:latest
    container_name: simba-queue-ai-soal
    healthcheck:
      disable: true
    entrypoint: ["php", "artisan", "queue:work", "--queue=ai-soal", "--tries=1", "--timeout=600", "--sleep=1", "--memory=512"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: simba
      DB_USERNAME: simba
      DB_PASSWORD: "${DB_PASSWORD:-simba_secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_MODEL_FALLBACK_1: "${OLLAMA_MODEL_FALLBACK_1:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      OLLAMA_MODEL_FALLBACK_2: "${OLLAMA_MODEL_FALLBACK_2:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_ENDPOINT: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
      GEMINI_SHORT_TIMEOUT: "8"
      PYTHON_PATH: "python3.14"
      PDF_EXTRACT_TIMEOUT: "600"
      SYMBOLS_ENABLED: "true"
      BLOOM_ENABLED: "true"
      BLOOM_MIN_CONFIDENCE: "0.34"
      SOAL_KONTEKS_ENABLED: "true"
      REMEDIAL_COOLDOWN_HARI: "7"
      REMEDIAL_AMBANG_PERTEMUAN: "75"
      PREDIKSI_AMBANG_AMAN: "20"
      PREDIKSI_AMBANG_PANTAU: "40"
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - simba-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  queue-pertemuan:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        INSTALL_DEV: "false"
    # Satu image dipakai bersama app + semua worker, supaya kode tidak pernah
    # berbeda antar container (penyebab 500 "class not found"/versi lama).
    image: simba-app:latest
    container_name: simba-queue-pertemuan
    healthcheck:
      disable: true
    entrypoint: ["php", "artisan", "queue:work", "--queue=pertemuan", "--tries=2", "--timeout=300", "--sleep=1", "--memory=256"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: simba
      DB_USERNAME: simba
      DB_PASSWORD: "${DB_PASSWORD:-simba_secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_MODEL_FALLBACK_1: "${OLLAMA_MODEL_FALLBACK_1:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      OLLAMA_MODEL_FALLBACK_2: "${OLLAMA_MODEL_FALLBACK_2:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_ENDPOINT: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
      GEMINI_SHORT_TIMEOUT: "8"
      PYTHON_PATH: "python3.14"
      PDF_EXTRACT_TIMEOUT: "600"
      SYMBOLS_ENABLED: "true"
      BLOOM_ENABLED: "true"
      BLOOM_MIN_CONFIDENCE: "0.34"
      SOAL_KONTEKS_ENABLED: "true"
      REMEDIAL_COOLDOWN_HARI: "7"
      REMEDIAL_AMBANG_PERTEMUAN: "75"
      PREDIKSI_AMBANG_AMAN: "20"
      PREDIKSI_AMBANG_PANTAU: "40"
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - simba-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Pemindaian rumus punya worker sendiri: guru menekan tombol dan job langsung
  # dikerjakan, tidak menunggu antrean pertemuan/soal yang bisa menit-menit.
  queue-rumus:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        INSTALL_DEV: "false"
    # Satu image dipakai bersama app + semua worker, supaya kode tidak pernah
    # berbeda antar container (penyebab 500 "class not found"/versi lama).
    image: simba-app:latest
    container_name: simba-queue-rumus
    healthcheck:
      disable: true
    entrypoint: ["php", "artisan", "queue:work", "--queue=rumus", "--tries=1", "--timeout=200", "--sleep=1", "--memory=256"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: simba
      DB_USERNAME: simba
      DB_PASSWORD: "${DB_PASSWORD:-simba_secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_MODEL_FALLBACK_1: "${OLLAMA_MODEL_FALLBACK_1:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      OLLAMA_MODEL_FALLBACK_2: "${OLLAMA_MODEL_FALLBACK_2:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_ENDPOINT: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
      GEMINI_SHORT_TIMEOUT: "8"
      PYTHON_PATH: "python3.14"
      PDF_EXTRACT_TIMEOUT: "600"
      PDF_FORMULA_OCR_BUDGET: "180"
      SYMBOLS_ENABLED: "true"
      BLOOM_ENABLED: "true"
      BLOOM_MIN_CONFIDENCE: "0.34"
      SOAL_KONTEKS_ENABLED: "true"
      REMEDIAL_COOLDOWN_HARI: "7"
      REMEDIAL_AMBANG_PERTEMUAN: "75"
      PREDIKSI_AMBANG_AMAN: "20"
      PREDIKSI_AMBANG_PANTAU: "40"
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - simba-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  queue-default:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        INSTALL_DEV: "false"
    # Satu image dipakai bersama app + semua worker, supaya kode tidak pernah
    # berbeda antar container (penyebab 500 "class not found"/versi lama).
    image: simba-app:latest
    container_name: simba-queue-default
    healthcheck:
      disable: true
    entrypoint: ["php", "artisan", "queue:work", "--queue=default", "--tries=1", "--timeout=600", "--sleep=1", "--memory=256"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: simba
      DB_USERNAME: simba
      DB_PASSWORD: "${DB_PASSWORD:-simba_secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      FILESYSTEM_DISK: public
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_MODEL_FALLBACK_1: "${OLLAMA_MODEL_FALLBACK_1:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      OLLAMA_MODEL_FALLBACK_2: "${OLLAMA_MODEL_FALLBACK_2:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_ENDPOINT: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
      GEMINI_SHORT_TIMEOUT: "8"
      PYTHON_PATH: "python3.14"
      PDF_EXTRACT_TIMEOUT: "600"
      SYMBOLS_ENABLED: "true"
      BLOOM_ENABLED: "true"
      BLOOM_MIN_CONFIDENCE: "0.34"
      SOAL_KONTEKS_ENABLED: "true"
      REMEDIAL_COOLDOWN_HARI: "7"
      REMEDIAL_AMBANG_PERTEMUAN: "75"
      PREDIKSI_AMBANG_AMAN: "20"
      PREDIKSI_AMBANG_PANTAU: "40"
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - simba-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # =========================================================================
  # Scheduler (Laravel cron)
  # =========================================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        INSTALL_DEV: "false"
    # Satu image dipakai bersama app + semua worker, supaya kode tidak pernah
    # berbeda antar container (penyebab 500 "class not found"/versi lama).
    image: simba-app:latest
    container_name: simba-scheduler
    healthcheck:
      disable: true
    entrypoint: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: simba
      DB_USERNAME: simba
      DB_PASSWORD: "${DB_PASSWORD:-simba_secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_MODEL_FALLBACK_1: "${OLLAMA_MODEL_FALLBACK_1:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      OLLAMA_MODEL_FALLBACK_2: "${OLLAMA_MODEL_FALLBACK_2:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_ENDPOINT: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
      GEMINI_SHORT_TIMEOUT: "8"
      PYTHON_PATH: "python3.14"
      PDF_EXTRACT_TIMEOUT: "600"
      SYMBOLS_ENABLED: "true"
      BLOOM_ENABLED: "true"
      BLOOM_MIN_CONFIDENCE: "0.34"
      SOAL_KONTEKS_ENABLED: "true"
      REMEDIAL_COOLDOWN_HARI: "7"
      REMEDIAL_AMBANG_PERTEMUAN: "75"
      PREDIKSI_AMBANG_AMAN: "20"
      PREDIKSI_AMBANG_PANTAU: "40"
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - simba-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # =========================================================================
  # Development Services (profile: dev)
  # =========================================================================
  vite:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: simba-vite
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_APP_URL: "http://localhost:8000"
    volumes:
      - ./resources:/app/resources
      - ./public:/app/public
      - ./vite.config.js:/app/vite.config.js
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - simba-network
    profiles:
      - dev

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: simba-app-dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: simba
      DB_USERNAME: simba
      DB_PASSWORD: "${DB_PASSWORD:-simba_secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      CACHE_STORE: file
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_MODEL_FALLBACK_1: "${OLLAMA_MODEL_FALLBACK_1:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      OLLAMA_MODEL_FALLBACK_2: "${OLLAMA_MODEL_FALLBACK_2:-${OLLAMA_MODEL:-qwen2.5:7b}}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_ENDPOINT: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
      GEMINI_SHORT_TIMEOUT: "8"
      PYTHON_PATH: "python3.14"
      PDF_EXTRACT_TIMEOUT: "600"
      SYMBOLS_ENABLED: "true"
      BLOOM_ENABLED: "true"
      BLOOM_MIN_CONFIDENCE: "0.34"
      SOAL_KONTEKS_ENABLED: "true"
      REMEDIAL_COOLDOWN_HARI: "7"
      REMEDIAL_AMBANG_PERTEMUAN: "75"
      PREDIKSI_AMBANG_AMAN: "20"
      PREDIKSI_AMBANG_PANTAU: "40"
    volumes:
      - ./:/app
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
      - node_modules:/app/node_modules
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      vite:
        condition: service_started
    networks:
      - simba-network
    profiles:
      - dev

# =============================================================================
# Volumes
# =============================================================================
volumes:
  db_data:
  redis_data:
  node_modules:

# =============================================================================
# Networks
# =============================================================================
networks:
  simba-network:
    driver: bridge